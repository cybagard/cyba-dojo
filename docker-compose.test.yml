# Ephemeral datastores for the E2E suite, published on localhost so the
# host-run app and tests can reach them. Brought up/down by test/run-e2e.sh.
services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_DB: books
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
