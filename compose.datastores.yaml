# Shared datastore definition for Cyba Dojo.
#
# This file is `include`d (Compose v2.24+) by compose.yaml, compose.hub.yaml,
# compose.test.yaml and compose.e2e.yaml so the three "broken by design" datastores
# are defined ONCE and never drift apart. Do not run it as the full app on its own —
# it defines only the databases (no vulnweb).
#
# Deliberately weak (see docs/VULN_MAP.md, CFG-5):
#   postgres  trust authentication — anything holding a service name connects
#   mysql     root / root, forced onto the legacy native password plugin
#   mongo     no authentication at all
#
# None of them publish a host port here; each including project decides exposure by
# re-declaring a `ports:` entry (see compose.test.yaml).

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_DB: books
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d books || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  mongo:
    image: mongo:latest
    healthcheck:
      test:
        ["CMD-SHELL",
         "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || mongo --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
