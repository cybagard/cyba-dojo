services:
  vulnweb:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      WAIT_HOSTS: mysql:3306, postgres:5432, mongo:27017
      WAIT_HOSTS_TIMEOUT: 30
      WAIT_SLEEP_INTERVAL: 5
      WAIT_HOSTS_CONNECT_TIMEOUT: 30
      WAIT_BEFORE_HOSTS: 20
    command: sh -c "/wait && npm start"
  mysql:
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
