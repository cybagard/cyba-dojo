# Self-contained E2E environment: the FULL datastore stack (PostgreSQL +
# MySQL + MongoDB) plus the test suite, all running inside containers.
#
# The app and both test suites (test:api = `node --test`, test:ui = Playwright)
# run INSIDE the `test` service. The three datastores are pure sidecars,
# reachable only by compose service name - nothing is published on the host.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up --abort-on-container-exit --exit-code-from test
#   docker compose -f docker-compose.e2e.yml down -v   # tear down (and drop node_modules volume)
#
# `test` mounts the repo at /work with an ANONYMOUS volume over /work/node_modules,
# so `npm install` is isolated in the container and never writes into this checkout.
name: cyba-dojo-e2e

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_DB: books
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d books"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot 2>/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  mongo:
    image: mongo:latest
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || mongo --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  test:
    image: node:22
    working_dir: /work
    volumes:
      - .:/work
      - /work/node_modules
    environment:
      PGHOST: postgres
      MYSQL_HOST: mysql
      MONGO_HOST: mongo
      UI_PORT: "3000"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command:
      - sh
      - -c
      - set -x; npm install; npx playwright install --with-deps chromium; npm run test:api; npm run test:ui
