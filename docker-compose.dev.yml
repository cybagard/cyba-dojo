services:
  vulnweb:
    volumes:
      - .:/work
      - /work/node_modules
    ports:
      - "3000:3000"
      - "9229:9229" #debug port
    environment:
      NODE_ENV: "development"
      WAIT_HOSTS: mysql:3306, postgres:5432, mongo:27017
      WAIT_HOSTS_TIMEOUT: 30
      WAIT_SLEEP_INTERVAL: 5
      WAIT_HOSTS_CONNECT_TIMEOUT: 30
      WAIT_BEFORE_HOSTS: 20
    command: sh -c "/wait && npm run dev"
  mysql:
    volumes:
     - "./config/mysql/docker-entrypoint.sh:/docker-entrypoint.sh"
     - "./config/mysql/my.cnf:/etc/mysql/my.cnf"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh", "mysqld"]
    command: --default-authentication-plugin=mysql_native_password
